<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide — a one-string guitar in the browser</title>
    <meta
      name="description"
      content="A fretless slide guitar you play by dragging. Every note is synthesised in the page, one plucked string at a time."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Slide</a>
      </nav>
    </header>
    <main>
      <h1>Slide</h1>

      <!--
        The string is a real <button>, not a div with a click handler. Pointer
        events give it mouse, touch and pen from one code path; being a button
        gives it the keyboard, a focus ring and a name for free.
      -->
      <button
        type="button"
        class="string"
        id="string"
        aria-label="Slide string. Press to pluck; drag sideways, or use the left and right arrow keys, to slide the pitch."
      >
        <span class="wire" id="wire" aria-hidden="true"></span>
        <span class="bottleneck" id="bottleneck" aria-hidden="true"></span>
      </button>

      <p class="readout" id="readout">A3</p>
      <p class="hint">Drag along the string. There is no wrong note.</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
